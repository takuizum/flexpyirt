[project]
name = "flexpyirt"
version = "0.0.1"
description = "Bock–Aitkin EM estimation for item response theory models, built on JAX."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "takuizum" }]
keywords = [
    "item response theory",
    "IRT",
    "psychometrics",
    "EM algorithm",
    "marginal maximum likelihood",
    "JAX",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.urls]
Homepage = "https://github.com/takuizum/flexpyirt"
Documentation = "https://takuizum.github.io/flexpyirt/"
Repository = "https://github.com/takuizum/flexpyirt"
Issues = "https://github.com/takuizum/flexpyirt/issues"
Changelog = "https://github.com/takuizum/flexpyirt/blob/main/CHANGELOG.md"

[project.optional-dependencies]
polars = ["polars>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flexpyirt"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/validation",
    "/mkdocs.yml",
    "/CHANGELOG.md",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow Japanese / math characters in strings and comments
    "N803", "N806",                # allow math-style capital names (Q, J, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/flexpyirt", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
