[project]
name = "flexpyirt"
dynamic = ["version"]
description = "Bock–Aitkin EM estimation for item response theory models, built on JAX."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "takuizum" }]
keywords = [
    "item response theory",
    "IRT",
    "psychometrics",
    "EM algorithm",
    "marginal maximum likelihood",
    "JAX",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "flexpyctt",
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.urls]
Homepage = "https://github.com/takuizum/flexpyirt"
Documentation = "https://takuizum.github.io/flexpyirt/"
Repository = "https://github.com/takuizum/flexpyirt"
Issues = "https://github.com/takuizum/flexpyirt/issues"
Releases = "https://github.com/takuizum/flexpyirt/releases"

[project.optional-dependencies]
polars = ["polars>=1.0"]
# flexpyirt.plotting (imported lazily; DESIGN.md §21).
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pytest-xdist>=3.8.0",
    "matplotlib>=3.8",
    # Workspace member, for development only: `uv sync` installs it (editable) so that its tests
    # and type checks run from the root environment. flexpyirt itself does not depend on it.
    "flexpyequate",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]

# uv workspace: flexpyirt (this file, src/flexpyirt) and the JAX-free distributions under
# packages/ (flexpyctt, flexpyequate) share one lockfile and one version tag (DESIGN.md §16.18).
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
flexpyctt = { workspace = true }
flexpyequate = { workspace = true }

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version comes from the latest vX.Y.Z git tag (CONTRIBUTING.md "リリース").
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/flexpyirt"]

# The sdist carries the sources, tests (with the mirt reference values), R validation scripts,
# benchmarks and documentation; repository tooling stays out.
[tool.hatch.build.targets.sdist]
# packages/flexpyctt is included: flexpyirt's tests read reference values from
# packages/flexpyctt/tests/reference. packages/flexpyequate is independent of flexpyirt and has
# its own sdist.
exclude = [
    "/.github",
    "/.python-version",
    "/CLAUDE.md",
    "/uv.lock",
    "/site",
    "/packages/flexpyequate",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "packages/flexpyctt/src", "packages/flexpyctt/tests"]
# packages/flexpyequate has its own [tool.ruff] (the same rules); `ruff check .` from the root
# applies it to that directory.

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "D"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow Japanese / math characters in strings and comments
    "N803", "N806",                # allow math-style capital names (Q, J, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"packages/*/tests/**" = ["D"]

# packages/flexpyequate is checked with its own [tool.mypy], from its directory (its tests are a
# package named `tests`, like the root's, so one mypy run cannot hold both).
[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/flexpyirt",
    "tests",
    "scripts",
    "packages/flexpyctt/src/flexpyctt",
    "packages/flexpyctt/tests",
]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel by default (pytest-xdist). `loadfile` keeps each module on one worker so JAX
# compilations and cached fits are reused within a module (conftest clears the cache between
# modules). Use `-n 0` to run serially, e.g. when debugging.
addopts = ["-ra", "--strict-markers", "--strict-config", "-n", "auto", "--dist", "loadfile"]
markers = [
    "slow: takes more than ~5 s (with its share of a cached fit), or a mirt reference comparison; skipped on PR/push CI, run nightly and on release PRs. Deselect locally with -m 'not slow'.",
]
xfail_strict = true
