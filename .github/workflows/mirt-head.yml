name: mirt HEAD reference check

# Scheduled check of the committed mirt references against the latest R mirt on GitHub
# (philchalmers/mirt, default branch); VALIDATION.md, "R and mirt versions". Separate from the
# test CI (ci.yml), which never runs R.
#
# 1. regenerate: installs R and mirt HEAD, reruns every validation/r script that uses mirt
#    (validation/r/run_references.sh) and compares the new JSON with the committed JSON
#    (scripts/compare_references.py, VALIDATION.md tolerances).
# 2. test: runs the whole pytest suite against the regenerated references (the comparison tests
#    hold the per-quantity tolerances of VALIDATION.md).
# 3. report: on drift, a failed test or a failed script, opens an issue (or comments on the open
#    one). References are never updated automatically: a person reviews the drift, regenerates
#    locally and opens a PR.
on:
  schedule:
    - cron: "17 18 * * 0"  # Mondays 03:17 JST; scheduled runs check the develop branch
  workflow_dispatch:
    inputs:
      mirt_ref:
        description: "mirt commit, tag or branch on philchalmers/mirt"
        default: HEAD

permissions:
  contents: read

concurrency:
  group: mirt-head
  cancel-in-progress: false

env:
  FLEXPYIRT_R_LIB: ${{ github.workspace }}/../R-library
  MIRT_REF: ${{ inputs.mirt_ref || 'HEAD' }}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      drift: ${{ steps.compare.outputs.drift }}
      scripts: ${{ steps.run.outputs.status }}
      mirt: ${{ steps.mirt.outputs.mirt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install the R packages the reference scripts use
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libglpk-dev
          mkdir -p "$FLEXPYIRT_R_LIB"
          Rscript -e '
            lib <- Sys.getenv("FLEXPYIRT_R_LIB"); .libPaths(c(lib, .libPaths()))
            # mirt from CRAN first: its dependencies come as binaries; install_mirt.R then
            # replaces mirt itself with the GitHub version.
            pkgs <- c("mirt", "remotes", "jsonlite", "cacIRT", "dcurver", "equate", "equateIRT", "ltm",
                      "poibin", "polycor", "sirt", "SNSequate", "TAM")
            install.packages(pkgs, lib = lib)
            stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)))'
      - name: Install mirt from GitHub (${{ env.MIRT_REF }})
        id: mirt
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript validation/r/install_mirt.R "$MIRT_REF" | tee install.log
          echo "mirt=$(tail -n 1 install.log)" >> "$GITHUB_OUTPUT"
      - name: Keep the committed references
        run: cp -r tests/reference "$RUNNER_TEMP/committed"
      - name: Regenerate every mirt reference
        id: run
        env:
          JOBS: "4"
          LOG_DIR: ${{ runner.temp }}/logs
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          if validation/r/run_references.sh; then status=ok; else status=failed; fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Compare with the committed references
        id: compare
        run: |
          if uv run --no-project python scripts/compare_references.py \
              --base "$RUNNER_TEMP/committed" --new tests/reference --report drift.md; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the regenerated references, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirt-head-references
          path: |
            tests/reference/
            drift.md
            ${{ runner.temp }}/logs/
          if-no-files-found: warn

  test:
    needs: regenerate
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - name: Download the regenerated references
        uses: actions/download-artifact@v4
        with:
          name: mirt-head-references
          path: ${{ runner.temp }}/regenerated
      - name: Use them in place of the committed ones
        run: cp "$RUNNER_TEMP"/regenerated/tests/reference/*.json tests/reference/
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Pytest (full tier, shard ${{ matrix.shard }}/4, regenerated references)
        run: uv run pytest --durations=15 --shard "${{ matrix.shard }}/4"

  report:
    needs: [regenerate, test]
    if: >-
      always() && (needs.regenerate.result != 'success' || needs.test.result != 'success'
      || needs.regenerate.outputs.drift == 'true' || needs.regenerate.outputs.scripts != 'ok')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the drift report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mirt-head-references
          path: regenerated
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGENERATE: ${{ needs.regenerate.result }}
          SCRIPTS: ${{ needs.regenerate.outputs.scripts }}
          TESTS: ${{ needs.test.result }}
          MIRT: ${{ needs.regenerate.outputs.mirt }}
        run: |
          title="mirt HEAD reference check: drift or failure"
          {
            echo "The scheduled mirt HEAD reference check ([run]($RUN_URL)) found a difference."
            echo
            echo "- ${MIRT:-mirt: not installed}"
            echo "- R scripts: ${SCRIPTS:-not run} (job: $REGENERATE)"
            echo "- pytest on the regenerated references: $TESTS"
            echo
            echo "Review the drift (VALIDATION.md, \"R and mirt versions\"): a regression in mirt,"
            echo "a fix of a known mirt issue (#20), or a change to adopt. References are not"
            echo "updated automatically; regenerate locally and open a PR if the change is right."
            echo "The regenerated JSON, logs and report are in the run's \`mirt-head-references\` artifact."
            echo
            if [ -f regenerated/drift.md ]; then head -c 50000 regenerated/drift.md; fi
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number \
                   --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
