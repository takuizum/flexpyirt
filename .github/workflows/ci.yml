name: CI

# Test tiers (CONTRIBUTING.md, "Tests"):
# - fast (`-m "not slow"`): every PR and every push to develop/main.
# - full (everything, including the mirt reference comparisons), split into shards: nightly on
#   develop, on release PRs (develop -> main), and on manual runs.
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "37 17 * * *"  # 02:37 JST; scheduled runs test the develop branch
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier"
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

# A new push to the same PR cancels the run in progress (pushes to develop/main always finish).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Persistent JAX compilation cache, restored and saved with actions/cache below. Roughly halves
  # the time of the many small fits (later modules recompile after conftest clears JAX's caches).
  JAX_COMPILATION_CACHE_DIR: ${{ github.workspace }}/.jax-cache
  JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
  JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES: "0"
  # Keeps the cache from growing without bound across runs (least recently used entries go).
  JAX_COMPILATION_CACHE_MAX_SIZE: "1500000000"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.tier.outputs.full }}
      ref: ${{ steps.tier.outputs.ref }}
    steps:
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          TIER: ${{ inputs.tier }}
        run: |
          full=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$TIER" = full ]; } \
             || { [ "$EVENT" = pull_request ] && [ "$BASE" = main ]; }; then
            full=true
          fi
          ref=""
          if [ "$EVENT" = schedule ]; then ref=develop; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "full tier: $full; ref: ${ref:-(event default)}"

  # Lint, types and the fast tier of every package (flexpyirt at the root, flexpyctt and
  # flexpyequate under packages/). The job name ("test (3.x)") is a required status check.
  test:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      # Ruff reads packages/flexpyequate/pyproject.toml for that directory (same rules).
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      # flexpyequate has its own mypy configuration (packages/flexpyequate/pyproject.toml).
      - name: Mypy (flexpyequate)
        working-directory: packages/flexpyequate
        run: uv run --no-sync mypy
      - name: Restore JAX compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .jax-cache
          key: jax-fast-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-fast-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
            jax-fast-py${{ matrix.python-version }}-
      # Parallelism (pytest-xdist, -n auto) is set in pyproject.toml.
      - name: Pytest (fast tier)
        run: uv run pytest --durations=15 -m "not slow"
      # flexpyctt has its own pytest configuration (packages/flexpyctt/pyproject.toml).
      - name: Pytest (flexpyctt)
        run: uv run pytest packages/flexpyctt --durations=10
      # So has flexpyequate (packages/flexpyequate/pyproject.toml).
      - name: Pytest (flexpyequate)
        run: uv run pytest packages/flexpyequate --durations=10
      - name: Save JAX compilation cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .jax-cache
          key: jax-fast-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
      - name: Editable install smoke test (isolated env)
        run: |
          uv run --isolated --no-project --with-editable ./packages/flexpyctt --with-editable . \
            python -c "import flexpyctt, flexpyirt; print(flexpyctt.__version__, flexpyirt.__version__)"
          uv run --isolated --no-project --with-editable ./packages/flexpyequate \
            python -c "import flexpyequate; print(flexpyequate.__version__)"

  # flexpyctt installed on its own: JAX must be absent, and the whole flexpyctt suite must pass
  # without it (DESIGN.md §16.18).
  flexpyctt:
    name: flexpyctt without JAX (${{ matrix.python-version }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install flexpyctt only
        run: uv sync --locked --package flexpyctt
      - name: JAX and flexpyirt are not installed, flexpyctt imports
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          present = [m for m in ('jax', 'jaxlib', 'flexpyirt') if u.find_spec(m) is not None]
          assert not present, present
          import flexpyctt
          print(flexpyctt.__version__)
          "
      - name: Pytest (flexpyctt, without JAX)
        run: uv run --no-sync pytest packages/flexpyctt --durations=10

  # flexpyequate installed on its own: JAX, flexpyirt and flexpyctt must be absent, and the whole
  # flexpyequate suite must pass without them (DESIGN.md §16.18).
  flexpyequate:
    name: flexpyequate without JAX (${{ matrix.python-version }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install flexpyequate only
        run: uv sync --locked --package flexpyequate
      - name: JAX, flexpyirt and flexpyctt are not installed, flexpyequate imports
        run: |
          uv run --no-sync python -c "
          import importlib.util as u
          names = ('jax', 'jaxlib', 'flexpyirt', 'flexpyctt')
          present = [m for m in names if u.find_spec(m) is not None]
          assert not present, present
          import flexpyequate
          print(flexpyequate.__version__)
          "
      - name: Pytest (flexpyequate, without JAX)
        run: uv run --no-sync pytest packages/flexpyequate --durations=10

  # The whole suite, split into shards of about equal duration (tests/durations.json).
  test-full:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    name: test-full (${{ matrix.python-version }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Restore JAX compilation cache
        uses: actions/cache/restore@v4
        with:
          path: .jax-cache
          key: jax-full${{ matrix.shard }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-full${{ matrix.shard }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
            jax-full${{ matrix.shard }}-py${{ matrix.python-version }}-
      - name: Pytest (full tier, shard ${{ matrix.shard }}/4)
        run: |
          uv run pytest --durations=15 --shard "${{ matrix.shard }}/4" \
            --write-durations "durations-${{ matrix.shard }}.json"
      - name: Save JAX compilation cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .jax-cache
          key: jax-full${{ matrix.shard }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
      # Measured seconds per module, to refresh tests/durations.json (CONTRIBUTING.md, "Tests").
      - name: Upload module durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durations-py${{ matrix.python-version }}-shard${{ matrix.shard }}
          path: durations-${{ matrix.shard }}.json
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel of each package
        run: |
          uv build --package flexpyctt
          uv build --package flexpyequate
          uv build --package flexpyirt
          ls dist
      - name: Check metadata (PyPI rendering of each README.md)
        run: uvx twine check --strict dist/*
      - name: Smoke test the flexpyctt wheel alone (isolated env, no JAX)
        run: |
          uv run --isolated --no-project --with dist/flexpyctt-*.whl python -c "
          import importlib.util as u
          assert u.find_spec('jax') is None
          import flexpyctt
          print(flexpyctt.__version__)
          "
      - name: Smoke test the flexpyequate wheel alone (isolated env, no JAX)
        run: |
          uv run --isolated --no-project --with dist/flexpyequate-*.whl python -c "
          import importlib.util as u
          present = [m for m in ('jax', 'flexpyirt', 'flexpyctt') if u.find_spec(m) is not None]
          assert not present, present
          import flexpyequate
          print(flexpyequate.__version__)
          "
      # flexpyirt depends on flexpyctt, which may not be on PyPI at this version: install both wheels.
      - name: Smoke test the flexpyirt wheel (isolated env)
        run: |
          uv run --isolated --no-project --with dist/flexpyctt-*.whl --with dist/flexpyirt-*.whl \
            python -c "import flexpyirt, flexpyctt; assert flexpyirt.__version__ == flexpyctt.__version__; print(flexpyirt.__version__)"
      - name: The three wheels have the same version
        run: test "$(ls dist/*.whl | sed -E 's/.*-([^-]+)-py3-none-any\.whl/\1/' | sort -u | wc -l)" = 1
