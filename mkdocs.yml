site_name: flexpyirt
site_description: Bock–Aitkin EM estimation for item response theory models, built on JAX.
site_url: https://takuizum.github.io/flexpyirt/
repo_url: https://github.com/takuizum/flexpyirt
repo_name: takuizum/flexpyirt
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2026 takuizum

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The site is built from the same Markdown files that GitHub renders (X.md / X.ja.md).
# scripts/mkdocs_hooks.py drops the in-page language links, points links outside docs/ to GitHub
# and puts the flexpyequate README (its PyPI page) into equating.md.
hooks:
  - scripts/mkdocs_hooks.py

# docs/dev/ holds developer documents (design, validation plan, roadmap). They are read on GitHub
# and are not part of the user-facing site.
exclude_docs: |
  dev/

nav:
  - Home: index.md
  - User guide: guide.md
  - Theory: theory.md
  - API reference: reference.md
  - Score equating (flexpyequate): equating.md
  - Accuracy and validation: accuracy.md

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_description: JAX による Bock–Aitkin EM の項目反応理論（IRT）推定ライブラリ。
          nav_translations:
            Home: ホーム
            User guide: ユーザーガイド
            Theory: 理論
            API reference: API リファレンス
            Score equating (flexpyequate): 得点の等化（flexpyequate）
            Accuracy and validation: 精度と検証

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-compatible anchors (keeps Japanese headings), so links work in both places.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn
