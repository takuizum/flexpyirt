site_name: flexpyirt
site_description: Bock–Aitkin EM estimation for item response theory models, built on JAX.
site_url: https://takuizum.github.io/flexpyirt/
repo_url: https://github.com/takuizum/flexpyirt
repo_name: takuizum/flexpyirt
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 takuizum

theme:
  name: material
  language: ja
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: ダークモードへ
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: ライトモードへ

nav:
  - ホーム: index.md
  - はじめに: getting-started.md
  - ユーザーガイド:
      - 単一群（2PL / Rasch）: guide/single-group.md
      - 多母集団（部分アンカー）: guide/multigroup.md
      - 固定パラメタ推定（FIPC）: guide/fipc.md
      - GRM と欠測: guide/grm-missing.md
      - パラメタ表の編集: guide/parameter-table.md
  - API リファレンス:
      - fit: reference/fit.md
      - Model: reference/model.md
      - 項目モデル: reference/items.md
      - 潜在分布: reference/latent.md
      - 推定設定: reference/method.md
      - FitResult: reference/result.md
      - 例外と警告: reference/errors.md
  - 変更履歴: changelog.md
  - 開発者向け:
      - 設計書: DESIGN.md
      - API 設計案: API.md
      - 検証計画（R mirt 照合）: VALIDATION.md
      - ロードマップ: ROADMAP.md
      - リリース手順: dev/releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true
            filters: ["!^_"]
